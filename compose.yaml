name: graph-algorithm-bench
services:
  neo4j:
    build:
      context: .docker-context
      target: neo4j
    image: graph-bench-neo4j:local
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -a bolt://localhost:7687 'RETURN gds.version()' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [bench]
  benchmark:
    build:
      context: .docker-context
      target: benchmark
      args:
        BUILD_JOBS: ${BUILD_JOBS:-4}
    image: graph-bench:local
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      BENCH_NEO4J_HEAP: 2G
      BENCH_NEO4J_PAGE_CACHE: 512M
    volumes:
      - ${BENCH_OUTPUT:-./docker-results}:/work
    mem_limit: 4g
    cpus: 2
    networks: [bench]
networks:
  bench:
    internal: true
